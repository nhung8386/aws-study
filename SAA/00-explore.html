    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .aws-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .aws-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.1);
        }

        /* Tag Styles */
        .keyword-tag {
            transition: all 0.2s;
            position: relative;
            cursor: pointer;
        }

        .keyword-tag:hover {
            background-color: #eff6ff;
            color: #1d4ed8;
            border-color: #3b82f6;
        }

        .keyword-tag:active {
            transform: scale(0.95);
        }

        .highlight {
            background-color: #fef08a;
            color: #1e40af;
            padding: 0 2px;
            border-radius: 2px;
        }

        .gradient-header {
            background: linear-gradient(135deg, #232f3e 0%, #1a1a1a 100%);
        }

        /* Enhanced Tooltip Style */
        .tooltip {
            visibility: hidden;
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1e293b;
            color: #fff;
            text-align: left;
            padding: 10px 14px;
            border-radius: 8px;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            width: max-content;
            max-width: 280px;
            font-size: 0.75rem;
            font-weight: 400;
            line-height: 1.5;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            /* Tránh việc tooltip che mất click event */
        }

        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }

        .keyword-tag:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }
    </style>
</head>

        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const servicesGrid = document.getElementById('servicesGrid');
        const emptyState = document.getElementById('emptyState');
        const categoryButtons = document.querySelectorAll('.filter-btn');
        let currentFilter = 'all';

        function renderServices(searchTerm = '') {
            const filteredServices = services.filter(service => {
                const searchLower = searchTerm.toLowerCase();
                const matchesSearch =
                    service.name.toLowerCase().includes(searchLower) ||
                    service.description.toLowerCase().includes(searchLower) ||
                    service.keywords.some(k => k.t.toLowerCase().includes(searchLower));

                const matchesCategory = currentFilter === 'all' || service.category === currentFilter;

                return matchesSearch && matchesCategory;
            });

            // Update Clear button visibility
            clearSearchBtn.classList.toggle('hidden', searchTerm === '');

            if (filteredServices.length === 0) {
                servicesGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            servicesGrid.innerHTML = filteredServices.map(service => `
                <div class="aws-card bg-white rounded-3xl border border-gray-100 p-8 flex flex-col h-full shadow-sm hover:shadow-xl">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="px-3 py-1 bg-${service.color}-50 text-${service.color}-600 rounded-full text-[10px] font-bold uppercase tracking-wider border border-${service.color}-100">
                                    ${service.category}
                                </span>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-800 tracking-tight">${highlightText(service.name, searchTerm)}</h3>
                        </div>
                        <div class="h-12 w-12 bg-slate-50 flex items-center justify-center rounded-2xl border border-slate-100 text-${service.color}-500 shadow-sm">
                            <i class="fas fa-cube text-xl"></i>
                        </div>
                    </div>
                    
                    <p class="text-slate-500 mb-8 text-sm leading-relaxed font-normal">
                        ${highlightText(service.description, searchTerm)}
                    </p>

                    <div class="mt-auto">
                        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-3">Từ khóa (Click để tìm)</div>
                        <div class="flex flex-wrap gap-2">
                            ${service.keywords.map(kw => `
                                <div class="keyword-tag bg-white text-slate-600 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200" 
                                     onclick="applySearch('${kw.t}')">
                                    ${highlightText(kw.t, searchTerm)}
                                    <div class="tooltip">
                                        <div class="font-bold text-blue-400 mb-1">Giải nghĩa:</div>
                                        ${kw.d}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function highlightText(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${term})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function applySearch(term) {
            searchInput.value = term;
            renderServices(term);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetSearch() {
            searchInput.value = '';
            renderServices('');
        }

        searchInput.addEventListener('input', (e) => {
            renderServices(e.target.value);
        });

        clearSearchBtn.addEventListener('click', resetSearch);

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => {
                    b.classList.remove('active', 'bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-200');
                    b.classList.add('bg-white', 'text-gray-600');
                });
                btn.classList.add('active', 'bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-200');
                btn.classList.remove('bg-white', 'text-gray-600');

                currentFilter = btn.dataset.category;
                renderServices(searchInput.value);
            });
        });

        // Initial render
        renderServices();
    </script>
